<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KIỂM TRA CUỐI HỌC KỲ I (NĂM HỌC 2026 - 2027)</title>

<style>
:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mut:#64748b;--pri:#4f46e5;--ok:#16a34a;--bad:#dc2626;--bd:#cbd5e1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Segoe UI,Roboto,Arial,sans-serif;overflow-x:hidden}
.wrap{max-width:860px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border-radius:14px;padding:16px 18px;margin:12px 0;box-shadow:0 2px 10px #0001}
h1{font-size:1.6rem;margin:4px 0}.mut{color:var(--mut)}.hidden{display:none!important}
input[type=text],input[type=password]{font:inherit;width:100%;padding:10px 12px;border:2px solid var(--bd);border-radius:10px;margin:4px 0 10px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 18px;color:#fff;background:var(--pri);font-weight:600}
button.sec{background:#e2e8f0;color:#0f172a}button.big{width:100%;font-size:1.1rem;padding:13px}button:disabled{opacity:.5}
.top{position:sticky;top:0;z-index:20;background:#4338cae6;color:#fff;padding:8px 14px;display:flex;gap:12px;align-items:center;backdrop-filter:blur(6px)}
.top b{flex:1}.top .t{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.1rem}
.q{border-left:5px solid var(--pri)}.q.ds{border-color:#0d9488}.q.tln{border-color:#ea580c}.q.tl{border-color:#94a3b8}
.q.ok{background:#f0fdf4}.q.bad{background:#fef2f2}
.qh{font-weight:800;margin-bottom:6px;color:var(--pri)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:2px solid var(--bd);border-radius:10px;margin:6px 0;cursor:pointer}
.opt.on{border-color:var(--pri);background:#eef2ff}.opt.good{border-color:var(--ok);background:#dcfce7}.opt.wrong{border-color:var(--bad);background:#fee2e2}
.opt.o0,.tf.o0{--c:#2563eb;--cl:#dbeafe}.opt.o1,.tf.o1{--c:#16a34a;--cl:#dcfce7}.opt.o2,.tf.o2{--c:#ea580c;--cl:#ffedd5}.opt.o3,.tf.o3{--c:#db2777;--cl:#fce7f3}
.opt{border-color:var(--cl);background:#fff}.opt:hover{background:var(--cl)}
.opt.on{border-color:var(--c);background:var(--cl);box-shadow:0 0 0 2px var(--c) inset}
.opt .l,.tf .l{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;flex:none}
.opt.good .l{background:var(--ok)}.opt.wrong .l{background:var(--bad)}
.tf{border:2px solid var(--cl);border-radius:10px;padding:7px 10px;margin:6px 0;background:#fff}
.tf .tx{flex:1}
.part{margin:18px 0 4px;padding:9px 14px;border-radius:10px;color:#fff;font-weight:800;letter-spacing:.3px}
.part.tn{background:#4f46e5}.part.ds{background:#0d9488}.part.tln{background:#ea580c}.part.tl{background:#64748b}
.q{scroll-margin-top:60px}
.np{align-self:center;font-size:.72rem;font-weight:800;color:#fff;padding:3px 8px;border-radius:6px;margin-left:6px}
.np.tn{background:#4f46e5}.np.ds{background:#0d9488}.np.tln{background:#ea580c}.np.tl{background:#64748b}
.nav a.tn.d{background:#4f46e5}.nav a.ds.d{background:#0d9488}.nav a.tln.d{background:#ea580c}
.tlnbox{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.tcol{background:#fff7ed;border:2px solid #fdba74;border-radius:14px;padding:8px 7px;display:flex;flex-direction:column;align-items:center;gap:5px}
.tcell{width:46px;height:50px;border:2px solid #ea580c;border-radius:9px;background:#fff;font-size:1.6rem;font-weight:900;display:flex;align-items:center;justify-content:center;color:#9a3412;margin-bottom:3px}
.bub{width:31px;height:31px;border-radius:50%;border:2px solid var(--c);color:var(--c);font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;font-size:.95rem;transition:transform .08s}
.bub:hover{transform:scale(1.12)}.bub.on{background:var(--c);color:#fff;box-shadow:0 2px 6px #0003}
.tlnbox.good .tcell{border-color:var(--ok);background:#dcfce7}.tlnbox.wrong .tcell{border-color:var(--bad);background:#fee2e2}

.tf{display:flex;gap:8px;align-items:center}.tf .tx{flex:1}
.tf button{padding:6px 12px}.tf button[data-v='1']{background:#dcfce7;color:#166534}.tf button[data-v='0']{background:#fee2e2;color:#991b1b}.tf button[data-v='1'].on{background:#16a34a;color:#fff}.tf button[data-v='0'].on{background:#dc2626;color:#fff}
.tf.good .tx::after{content:" ✓";color:var(--ok);font-weight:800}.tf.wrong .tx::after{content:" ✗";color:var(--bad);font-weight:800}
.sol{margin-top:8px;padding:10px 12px;background:#fffbeb;border-radius:10px;border:1px solid #fde68a}
.immini{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}.im-l{flex:1 1 280px}.im-r{flex:0 1 300px}
svg,img{max-width:100%;height:auto}table{border-collapse:collapse}td,th{border:1px solid #94a3b8;padding:3px 8px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;z-index:20}
.nav a{min-width:30px;text-align:center;padding:4px 6px;border-radius:7px;background:#e2e8f0;color:#0f172a;text-decoration:none;font-size:.85rem;font-weight:700}.nav a.d{background:var(--pri);color:#fff}
.score{font-size:2.4rem;font-weight:900;color:var(--pri)}
body.lk{-webkit-user-select:none;user-select:none}body.lk input{-webkit-user-select:text;user-select:text}
@media print{body.lk{display:none!important}}
#shield{position:fixed;inset:0;z-index:9999;background:#0f172a;color:#fff;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:1.2rem}
