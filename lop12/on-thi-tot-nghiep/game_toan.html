<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KIỂM TRA CUỐI HỌC KỲ I (NĂM HỌC 2026 - 2027)</title>
<script>window.MathJax={tex:{inlineMath:[['$','$']],displayMath:[['$$','$$']],processEscapes:true}};</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#273449;--tx:#e2e8f0;--mut:#94a3b8;--pri:#6366f1;--ok:#22c55e;--bad:#ef4444;--gold:#fbbf24}
*{box-sizing:border-box}body{overflow-x:hidden;margin:0;background:radial-gradient(circle at 20% 0,#1e1b4b,var(--bg) 55%);color:var(--tx);font-family:Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 6px 24px #0006;margin-bottom:14px}
h1{margin:6px 0;font-size:30px}h2{margin:0 0 8px}.mut{color:var(--mut)}.center{text-align:center}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 18px;color:#fff;background:var(--pri);font-weight:600}
button:hover{filter:brightness(1.12)}button:disabled{opacity:.45;cursor:default}
button.sec{background:var(--card2)}button.big{font-size:18px;padding:14px 26px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{background:var(--card2);border-radius:999px;padding:6px 14px;font-weight:700}
.bar{height:10px;background:var(--card2);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#fbbf24);width:0;transition:width .3s}
.tbar>i{background:linear-gradient(90deg,#6366f1,#ef4444);transition:width 1s linear}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card2);margin:8px 0;padding:14px 16px;border:2px solid transparent}
.opt b{background:var(--pri);border-radius:8px;min-width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center}
.opt{border-left:6px solid #3b63e8;border-radius:10px;font-size:1.05em}.opt:nth-child(4n+2){border-left-color:#3a9a6e}.opt:nth-child(4n+3){border-left-color:#d98324}.opt:nth-child(4n+4){border-left-color:#7c3aed}
.opt:nth-child(4n+1) b{background:#3b63e8}.opt:nth-child(4n+2) b{background:#3a9a6e}.opt:nth-child(4n+3) b{background:#d98324}.opt:nth-child(4n+4) b{background:#7c3aed}
.ds{border-left:6px solid #3b63e8;border-radius:10px}.ds:nth-child(4n+2){border-left-color:#3a9a6e}.ds:nth-child(4n+3){border-left-color:#d98324}.ds:nth-child(4n+4){border-left-color:#7c3aed}
.ds button{padding:12px 16px;min-width:64px}
@media(max-width:560px){.ds{flex-wrap:wrap}.ds .t{flex:1 1 100%}.ds button{flex:1}.wrap{padding:10px}.card{padding:14px}}
.opt.ok{border-color:var(--ok);background:#14532d}.opt.bad{border-color:var(--bad);background:#7f1d1d}.opt.off{opacity:.3}
.stem{font-size:19px;line-height:1.6}.stem img{max-width:100%}
.immini{display:flex;gap:14px;flex-wrap:wrap}.immini .im-l{flex:1 1 300px}.immini .im-r{flex:0 1 260px;text-align:center}
.fig{text-align:center}.fig-missing{display:none}img.tikz{background:#fff;border-radius:8px;padding:4px}
table.tex-table{border-collapse:collapse;margin:8px auto}table.tex-table td{border:1px solid #64748b;padding:3px 10px}
input.ans{font:inherit;font-size:22px;padding:12px;border-radius:12px;border:2px solid var(--card2);background:var(--bg);color:var(--tx);width:100%;text-align:center}
.ds{display:flex;gap:8px;align-items:center;background:var(--card2);border-radius:12px;padding:10px 12px;margin:8px 0}
.ds .t{flex:1;min-width:0;overflow-x:auto}.ds .t img{max-width:100%;height:auto}.ds button{flex:none;padding:8px 14px;background:#334155}.ds button.sel{background:var(--pri)}
.ds.ok{outline:2px solid var(--ok)}.ds.bad{outline:2px solid var(--bad)}
.sol{margin-top:12px;background:#0b1220;border-left:4px solid var(--gold);padding:10px 14px;border-radius:8px}
.fb{font-weight:800;font-size:20px;margin:8px 0}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.hearts{font-size:22px;letter-spacing:2px}
.hidden{display:none}
.pop{animation:pop .35s}@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
table.lb{width:100%;border-collapse:collapse}table.lb td,table.lb th{padding:6px 8px;border-bottom:1px solid var(--card2);text-align:left}
canvas#fx{position:fixed;inset:0;pointer-events:none}
.badge{font-size:64px}

/* giao diện thẻ giống màn hình học sinh */
:root{--t0:#1b2646;--b0:#3b63e8;--t1:#17302b;--b1:#3a9a6e;--t2:#35271b;--b2:#d98324;--t3:#2a2147;--b3:#7c3aed;--stem:#1b2442}
.stemcard{background:var(--stem);border-radius:10px;padding:16px 16px 16px 20px;position:relative;font-size:19px;line-height:1.7;overflow-x:auto}
.stemcard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:10px 0 0 10px;background:linear-gradient(#3b63e8,#3a9a6e,#d98324,#7c3aed)}
.stemcard img{max-width:100%}
.opt,.ds{border:0;border-left:6px solid var(--b0);background:var(--t0);border-radius:10px;color:var(--tx);position:relative}
.opt.o1,.ds.o1{border-left-color:var(--b1);background:var(--t1)}.opt.o2,.ds.o2{border-left-color:var(--b2);background:var(--t2)}.opt.o3,.ds.o3{border-left-color:var(--b3);background:var(--t3)}
.opt b,.ds>b{background:none!important;min-width:1.4em;height:auto;font-size:1.1em;color:var(--b0)}
.o1>b{color:var(--b1)!important}.o2>b{color:var(--b2)!important}.o3>b{color:var(--b3)!important}
.opt>span{flex:1;min-width:0;overflow:visible}
.opt.ok{box-shadow:0 0 0 3px var(--ok);background:#14532d}.opt.bad{box-shadow:0 0 0 3px var(--bad);background:#7f1d1d}
.opt.ok:after{content:"✔";position:absolute;right:12px;top:8px;font-weight:800;color:#86efac}.opt.bad:after{content:"✘";position:absolute;right:12px;top:8px;font-weight:800;color:#fca5a5}
.ds.ok{outline:0;box-shadow:0 0 0 3px var(--ok)}.ds.bad{outline:0;box-shadow:0 0 0 3px var(--bad)}
.ds button.sel.yes,.ds button[data-v="1"].sel{background:var(--ok)}.ds button[data-v="0"].sel{background:var(--bad)}
@media(min-width:760px){#body.tn{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}#body.tn .opt{margin:6px 0}}
/* máy tính: dùng trọn màn hình – đề bên trái, đáp án bên phải */
.dk{display:none}
@media(min-width:1000px){
 .dk{display:inline-block}
 body[data-scr=play] .wrap{max-width:min(1700px,98vw);padding:14px 20px}
 body[data-scr=play]{--gfs:28px}
 body[data-scr=play] .hud .pill{font-size:20px}
 #qcard{display:grid;grid-template-columns:minmax(0,1fr);row-gap:6px;grid-template-areas:"stem" "body" "fb" "act" "sol";padding:22px 26px}
 #stem{grid-area:stem;font-size:var(--gfs)}
 #body{grid-area:body;margin-top:10px!important}#fb{grid-area:fb}#sol{grid-area:sol}#act{grid-area:act}
 #body.tn{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}#body.tn .opt{margin:8px 0}
 #body.tln{max-width:640px;margin-left:auto!important;margin-right:auto!important;width:100%}
 #body.ds4 .ds{margin:10px 0}
 #body .opt,#body .ds{font-size:calc(var(--gfs)*.95);padding:16px 20px}
 #body .opt>b,#body .ds>b{font-size:1.1em}
 .ds button{font-size:calc(var(--gfs)*.7);padding:10px 20px}
 input.ans{font-size:calc(var(--gfs)*1.2);padding:16px}
 #act button{font-size:calc(var(--gfs)*.75);padding:14px 26px}
 .fb{font-size:calc(var(--gfs)*.9)}.sol{font-size:calc(var(--gfs)*.85)}
}
@media(min-width:1700px){body[data-scr=play]{--gfs:32px}}
/* điện thoại: ý Đúng/Sai xuống dòng dưới nội dung (giống trang thi/live), A−/A+ chỉnh cỡ chữ */
@media(max-width:700px){.ds{flex-wrap:wrap}.ds>.t{flex:1 1 70%}.ds>button{flex:1 1 40%}.hud{gap:6px}.hud .pill,.hud button.pill{padding:4px 10px;font-size:14px}}
/* bảng trạng thái câu hỏi khi đang chơi */
#qs{position:fixed;inset:0;background:#020617ec;z-index:25;display:none;overflow:auto;padding:12px}#qs.on{display:block}
#qs .panel{max-width:760px;margin:0 auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;margin:12px 0}
.tile{height:54px;border-radius:10px;border:2px solid #475569;background:var(--card2);color:var(--tx);font-weight:800;font-size:18px;padding:0;position:relative}
.tile.ok{background:#14532d;border-color:#22c55e}.tile.bad{background:#7f1d1d;border-color:#ef4444}.tile.part{background:#78350f;border-color:#f59e0b}
.tile.skip{border-color:#38bdf8;background:#0c4a6e}.tile.todo{opacity:.95}.tile.cur{box-shadow:0 0 0 3px #fff}
.tile.ok:after,.tile.bad:after,.tile.part:after,.tile.skip:after{position:absolute;right:3px;top:0;font-size:12px}
.tile.ok:after{content:"✔"}.tile.bad:after{content:"✘"}.tile.part:after{content:"◐"}.tile.skip:after{content:"⏭"}
.tile:disabled{cursor:default}.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--mut)}.lg i{display:inline-block;width:14px;height:14px;border-radius:4px;border:2px solid #475569;vertical-align:-2px;margin-right:4px}
/* quản lý theo loại câu */
.qtypes{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.qtypes label{display:flex;align-items:center;gap:8px;background:var(--card2);border:2px solid #475569;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:15px}
.qtypes label.all{border-color:var(--ok)}.qtypes label.some{border-color:var(--gold)}.qtypes input{width:18px;height:18px}
.qh{margin:14px 0 4px;padding:8px 12px;border-radius:8px;background:#312e81;font-weight:800;display:flex;gap:8px;align-items:center}.qh .mut{font-weight:500;font-size:13px}.qh button{padding:4px 10px;font-size:13px}
.qsh{grid-column:1/-1;font-weight:800;font-size:14px;color:var(--mut);margin-top:6px}
/* menu quản lý câu hỏi */
#qm{position:fixed;inset:0;background:#020617e6;z-index:20;display:none;overflow:auto;padding:12px}#qm.on{display:block}
#qm .panel{max-width:900px;margin:0 auto}
.qmbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.qmbar button{padding:7px 12px;font-size:14px}.qmbar button.on{background:var(--pri)}
.qmbar input[type=search]{flex:1;min-width:160px;font:inherit;padding:8px 12px;border-radius:10px;border:2px solid var(--card2);background:var(--bg);color:var(--tx)}
.qi{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border-left:6px solid var(--b0);border-radius:10px;padding:10px 12px;margin:6px 0}
.qi:nth-child(4n+2){border-left-color:var(--b1)}.qi:nth-child(4n+3){border-left-color:var(--b2)}.qi:nth-child(4n+4){border-left-color:var(--b3)}
.qi.off{opacity:.45}.qi input{width:20px;height:20px;margin-top:3px;flex:none}
.qi .n{font-weight:800;min-width:2.2em}.qi .tx{flex:1;min-width:0;cursor:pointer;overflow-wrap:anywhere}
.qi .tg{font-size:12px;border:1px solid #64748b;border-radius:6px;padding:0 6px;color:var(--mut);margin-left:6px;white-space:nowrap}
.qi .star{background:none;padding:0 4px;font-size:20px;color:#64748b}.qi .star.on{color:var(--gold)}
.qi .full{margin-top:8px;font-size:16px;line-height:1.6}


.opt.ok,.opt.bad{padding-right:34px}
/* giao diện sáng (mặc định, theo chế độ của điện thoại như trang thi/live); chế độ tối giữ nền tối */
@media not all and (prefers-color-scheme:dark){
 :root{--bg:#f3f4f7;--card:#fff;--card2:#e8ebf5;--tx:#0f172a;--mut:#64748b;--pri:#2f55d4;--ok:#16a34a;--bad:#dc2626;--gold:#d97706;
  --t0:#e3e9f6;--t1:#e1ece9;--t2:#f1e8e1;--t3:#e9e4f3;--stem:#e8ebf5}
 body{background:var(--bg)}
 .card{box-shadow:0 2px 10px #0f172a1a;border:1px solid #d9dee8}
 button.sec{color:var(--tx)}
 .ds button{background:#fff;color:var(--tx);border:2px solid #9aa6bd}.ds button.sel{background:var(--pri);color:#fff;border-color:var(--pri)}
 .ds button[data-v="1"].sel{background:var(--ok);border-color:var(--ok)}.ds button[data-v="0"].sel{background:var(--bad);border-color:var(--bad)}
 .opt.ok{background:#d7f3df;color:#0b3d1c}.opt.bad{background:#fadcdc;color:#4a0b0b}
 .opt.ok:after{color:var(--ok)}.opt.bad:after{color:var(--bad)}
 .sol{background:#fff}
 .tile.ok{background:#d7f3df}.tile.bad{background:#fadcdc}.tile.part{background:#fde8c8}.tile.skip{background:#dbeafe}
 .tile.cur{box-shadow:0 0 0 3px #2f55d4}
 .qh{background:#d8dff7}
 #qs,#qm{background:#f3f4f7f2}
 input.ans{background:#fff}
}
/* điện thoại: thanh trạng thái dưới đáy giống trang thi/live, nút Kiểm tra rộng hết hàng */
#botbar{display:none}
@media(max-width:999px){
 body[data-scr=play]{padding-bottom:58px}
 #botbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(90deg,#d8dff7,#f0d9ea);border-top:2px solid #6c80e8;padding:5px 12px calc(5px + env(safe-area-inset-bottom));align-items:center;gap:8px;font-size:15px;line-height:1.2}
 body[data-scr=play] #botbar{display:flex}
 #botbar .st{flex:1;min-width:0;background:#2745b5;color:#fff;border-radius:999px;padding:6px 14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #botbar button{font-size:14px;font-weight:800;border:0;border-radius:10px;padding:5px 11px;background:#9aa6d6;color:#14214d}
 #botbar .fsv{font-weight:700;min-width:44px;text-align:center;color:#14214d}
 #bCheck,#bNext{flex:1 1 100%;padding:14px}
 #act .grow{display:none}
}
@media(max-width:999px) and (prefers-color-scheme:dark){#botbar{background:linear-gradient(90deg,#202c58,#3a2350)}#botbar .fsv{color:#cfd9ff}}
</style></head><body><canvas id="fx"></canvas><div id="botbar"><span class="st" id="bbSt"></span><button onclick="fz(-2)">A−</button><span class="fsv" id="bbFs">100%</span><button onclick="fz(2)">A+</button></div><div class="wrap">

<div id="home" class="card center">
 <div class="badge">🎓</div><h1 id="gtitle"></h1><div class="mut" id="gschool"></div>
 <p class="mut" id="ginfo"></p>
 <input id="name" class="ans" placeholder="Nhập tên của bạn" maxlength="30" style="max-width:340px">
 <div id="sidbox" class="hidden"><input id="sid" class="ans" placeholder="Nhập số báo danh" maxlength="20" style="max-width:340px"><div id="who" class="mut" style="margin-top:6px"></div></div>
 <div class="row" style="justify-content:center;margin-top:16px">
  <button class="big" onclick="start('challenge')">⚔️ Thử thách (mạng + thời gian)</button>
  <button class="big sec" onclick="start('practice')">📘 Luyện tập (xem lời giải)</button>
 </div>
 <div class="row" style="justify-content:center;margin-top:10px">
  <label class="mut"><input type="checkbox" id="shuf" checked> Xáo trộn câu hỏi</label>
  <button class="sec" id="btnWrong" onclick="start('wrong')">♻️ Ôn lại câu từng sai</button>
  <button class="sec" id="btnQM" onclick="qmOpen()">📋 Quản lý câu hỏi (<span id="qmCnt"></span>)</button>
 </div>
</div>

<div id="qm"><div class="panel card">
 <div class="row"><h2 class="grow">📋 Quản lý câu hỏi</h2><button class="sec" onclick="qmClose()">✖ Đóng</button></div>
 <div class="qtypes" id="qmTypes"></div>
 <div class="qmbar"><input type="search" id="qmSearch" placeholder="Tìm trong đề…" oninput="qmRender()">
  <button class="sec on" data-f="all" onclick="qmFilter(this)">Tất cả</button><button class="sec" data-f="TN" onclick="qmFilter(this)">TN</button>
  <button class="sec" data-f="DS" onclick="qmFilter(this)">Đúng/Sai</button><button class="sec" data-f="TLN" onclick="qmFilter(this)">Trả lời ngắn</button>
  <button class="sec" data-f="wrong" onclick="qmFilter(this)">♻️ Câu sai</button><button class="sec" data-f="star" onclick="qmFilter(this)">⭐ Đánh dấu</button></div>
 <div class="qmbar"><button class="sec" onclick="qmSel('all')">Chọn tất cả</button><button class="sec" onclick="qmSel('none')">Bỏ chọn</button>
  <button class="sec" onclick="qmSel('inv')">Đảo chọn</button><button class="sec" onclick="qmSel('wrong')">Chọn câu sai</button><button class="sec" onclick="qmSel('star')">Chọn câu ⭐</button>
  <span class="grow"></span><span class="mut" id="qmInfo"></span></div>
 <div id="qmList"></div>
 <div class="row" style="margin-top:12px;justify-content:center"><button class="big" onclick="qmClose()">✔ Xong – dùng các câu đã chọn</button></div>
</div></div>

<div id="qs"><div class="panel card">
 <div class="row"><h2 class="grow">📋 Câu hỏi của em</h2><button class="sec" onclick="qsClose()">✖ Đóng</button></div>
 <div id="qsSum" class="mut"></div>
 <div class="tiles" id="qsTiles"></div>
 <div class="lg"><span><i style="background:#14532d"></i>Đúng</span><span><i style="background:#7f1d1d"></i>Sai</span><span><i style="background:#78350f"></i>Đúng một phần</span><span><i style="background:#0c4a6e;border-color:#38bdf8"></i>Đã bỏ qua</span><span><i></i>Chưa làm</span></div>
 <p class="mut" style="font-size:14px">Bấm vào câu <b>chưa làm</b> hoặc <b>đã bỏ qua</b> để làm ngay. Câu đã làm không làm lại trong lượt này.</p>
 <div class="row" style="justify-content:space-between"><button class="sec" onclick="qsFirst()">➜ Câu chưa làm đầu tiên</button><button class="sec" onclick="qsFinish()">🏁 Nộp bài / xem kết quả</button></div>
</div></div>

<div id="play" class="hidden">
 <div class="card">
  <div class="hud"><span class="pill" id="hQ"></span><button class="sec pill" id="bQs" onclick="qsOpen()" style="border:0;color:var(--tx)">📋 Câu hỏi</button><span class="pill">⭐ <span id="hS">0</span></span>
   <span class="pill" id="hC">🔥 0</span><span class="hearts" id="hH"></span><span class="grow"></span>
   <span class="pill" id="hT">⏱</span>
   <button class="sec pill dk" onclick="fz(-2)" title="Thu nhỏ chữ (phím -)" style="border:0;color:var(--tx)">A−</button><button class="sec pill dk" onclick="fz(2)" title="Phóng to chữ (phím +)" style="border:0;color:var(--tx)">A+</button>
   <button class="sec pill dk" onclick="fsT()" title="Toàn màn hình (phím F)" style="border:0;color:var(--tx)">⛶ Toàn màn hình</button></div>
  <div class="bar" style="margin-top:10px"><i id="prog"></i></div>
  <div class="bar tbar" style="margin-top:6px"><i id="tbar"></i></div>
 </div>
 <div class="card" id="qcard">
  <div class="stemcard" id="stem"></div><div id="body" style="margin-top:12px"></div>
  <div id="fb"></div><div id="sol"></div>
  <div class="row" id="act" style="margin-top:12px">
   <button class="sec" id="b5050" onclick="fifty()">✂️ 50:50 (<span id="n5050">2</span>)</button>
   <button class="sec" id="bSkip" onclick="skipQ()">⏭ Bỏ qua (<span id="nSkip">1</span>)</button>
   <span class="grow"></span>
   <button id="bCheck" onclick="check()">Kiểm tra</button>
   <button id="bNext" class="hidden" onclick="next()">Câu tiếp ➜</button>
  </div>
 </div>
</div>

<div id="end" class="card center hidden">
 <div class="badge" id="eIcon">🏆</div><h1 id="eTitle"></h1>
 <p id="eStat" class="stem"></p>
 <div id="eBadges" class="mut"></div>

 6}{3} = \\dfrac{y - 3}{4} = \\dfrac{z - 5}{z}$", "correct": false}, {"html": "$\\dfrac{x - 1}{y} = \\dfrac{y - 2}{5} = \\dfrac{z - 3}{4}$", "correct": false}], "level": "N"}, {"id": "2H5N3-1", "type": "TN", "html": "Trong không gian $Oxyz$, phương trình nào sau đây là phương trình mặt cầu?", "sol": "Phương trình $(x - 1)^2 + (y - 2)^2 + (z - 3)^2 = 5^2$ là phương trình mặt cầu.", "choices": [{"html": "$(x^2 - 8)^2 + (y - 12)^2 + (z - 24)^2 = 9^2$", "correct": false}, {"html": "$(x - 9)^2 + (y^2 - 10)^2 + (z - 11)^2 = 12^2$", "correct": false}, {"html": "$(x - 13)^2 + (y - 24)^2 - (z - 36)^2 = 7^2$", "correct": false}, {"html": "$(x - 1)^2 + (y - 2)^2 + (z - 3)^2 = 5^2$", "correct": true}], "level": "N"}, {"id": "2D6N1-1", "type": "TN", "html": "Cho hai biến cố $A$ và $B$. Xác suất của biến cố $A$ với điều kiện biến cố $B$ đã xảy ra được gọi là xác suất của $A$ với điều kiện $B$, kí hiệu là $\\mathrm{P}(A|B)$. Phát biểu nào sau đây là đúng?", "sol": "Phát biểu “‘ Nếu $\\mathrm{P}(B) &gt; 0$ thì $\\mathrm{P}(A|B) = \\dfrac{\\mathrm{P}(A \\cap B)}{\\mathrm{P}(B)}$ ”’   là đúng.", "choices": [{"html": "Nếu $\\mathrm{P}(A) &gt; 0$ thì $\\mathrm{P}(A|B) = \\dfrac{\\mathrm{P}(A \\cap B)}{\\mathrm{P}(A)}$", "correct": false}, {"html": "Nếu $\\mathrm{P}(B) &gt; 0$ thì $\\mathrm{P}(A|B) = \\dfrac{\\mathrm{P}(A \\cap B)}{\\mathrm{P}(B)}$", "correct": true}, {"html": "Nếu $\\mathrm{P}(A\\cap B) &gt; 0$ thì $\\mathrm{P}(A|B) = \\dfrac{\\mathrm{P}(A)}{\\mathrm{P}(A \\cap B)}$", "correct": false}, {"html": "Nếu $\\mathrm{P}(A\\cap B) &gt; 0$ thì $\\mathrm{P}(A|B) = \\dfrac{\\mathrm{P}(B)}{\\mathrm{P}(A \\cap B)}$", "correct": false}], "level": "N"}, {"id": "2D3N1-1", "type": "TN", "html": "Xét mẫu số liệu ghép nhóm cho bởi hình vẽ. Khoảng biến thiên của mẫu số liệu ghép nhóm đó bằng \t<div class=\"center\"> \t\t<table class=\"tex-table\"><tr><td>Nhóm<\/td><td>Tần số<\/td><\/tr><tr><td>$\\left[a_1; a_2\\right)$<\/td><td>$n_1$<\/td><\/tr><tr><td>$\\left[a_2; a_3\\right)$<\/td><td>$n_2$<\/td><\/tr><tr><td>$\\ldots$<\/td><td>$\\ldots$<\/td><\/tr><tr><td>$\\left[a_m; a_{m+1}\\right)$<\/td><td>$n_m$<\/td><\/tr><tr><td><\/td><td>$n$<\/td><\/tr><\/table> \t<\/div>", "sol": "Khoảng biến thiên của mẫu số liệu ghép nhóm đó là $a_{m+1} - a_1$.", "choices": [{"html": "$a_{m+1} - a_1$", "correct": true}, {"html": "$a_{m+1} - a_m$", "correct": false}, {"html": "$n_m - n_1$", "correct": false}, {"html": "$n - n_m$", "correct": false}], "level": "N"}, {"id": "2D3N1-1", "type": "TN", "html": "Xét mẫu số liệu ghép nhóm có tứ phân vị thứ nhất, tứ phân vị thứ hai, tứ phân vị thứ ba lần lượt là $Q_1$, $Q_2$ và $Q_3$. Khoảng tứ phân vị của mẫu số liệu ghép nhóm đó bằng", "sol": "Khoảng tứ phân vị của mẫu số liệu ghép nhóm đó là $Q_3 - Q_1$.", "choices": [{"html": "$Q_2 - Q_1$", "correct": false}, {"html": "$Q_3 - Q_2$", "correct": false}, {"html": "$Q_3 - Q_1$", "correct": true}, {"html": "$Q_3 - 2Q_2 + Q_1$", "correct": false}], "level": "N"}, {"id": "2D4N3-3", "type": "TN", "html": "<div class=\"immini\"><div class=\"im-l\">Cho hàm số $y = f(x)$ liên tục, không âm trên đoạn $[a; b]$ như hình vẽ. Hình phẳng $(H)$ giới hạn bởi đồ thị hàm số $y = f(x)$, trục hoành và hai đường thẳng $x = a$, $x = b$ quay quanh trục $Ox$ tạo thành một khối tròn xoay có thể tích bằng<\/div><div class=\"im-r\"><div class=\"fig\"><img class=\"tikz\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAARkAAAC+CAIAAACOHOyiAAAACXBIWXMAABP+AAAT/gEHlDmEAAAbGklEQVR42u2df1AT6RnHFxtbFMtx1MBSRdTDO8qP9RczXoNQc65cYbizVbEkwzi1lBbQCRNvdKYwRePp0V5LK8dx3A1aqzdBRb0OFXBOxBMIcJ5SddGDu0tNFKs2OX+1iV7dyPaPt91us8kmJAGS3ef7FyS7TzZ5388+7/u8z/tsGMMwGAgE8ltT4CcAgYAlEAhYAoGAJRAIBCyBQMASCAQsgUDAEggEApZAIGAJBAKWQCBgCQQCAUsgELAEAgFLIBAIWAKBgCUQCFjyWg6Hw+XrVqsVmgoELHklmqbfeuutgoKCv//97xiGabXa4eFh9l2SJM1mM7QWCFjyrAsXLvzoRz+6ffs2+re9vX3u3Lno797eXoqiKioqoLVAwJJnffe733306NG0adNiY2OvXbsWFxcXHh6O3iorK8Mw7NChQ+CaQMCSV/rkk08UCgWGYWfOnFmxYgXXKWEYhuM4uCYQsOSVFi9efO3atUOHDtXW1rIs7dixw2AwYBhGUZTVagXXBApahQVPfbyenh6FQnH37t2cnJy } = -\\log 10^{-6{,}8} = 6{,}8$.", "choices": [{"html": "$-6{,}8$", "correct": false}, {"html": "$68$", "correct": false}, {"html": "$6{,}8$", "correct": true}, {"html": "$0{,}68$", "correct": false}], "level": "H"}, {"id": "2H5H2-7", "type": "DS", "html": "Trong không gian $Oxyz$, cho hai đường thẳng \t$$\\begin{aligned}\n\t\t\\Delta_1\\colon\\dfrac{x-1}{2}=\\dfrac{y-2}{1}=\\dfrac{z-3}{-2}\\text{ và }\\Delta_2\\colon\\dfrac{x-4}{-1}=\\dfrac{y-5}{-2}=\\dfrac{z-6}{2}.\n\t\\end{aligned}$$", "sol": "<ol class=\"itemchoice\" type=\"a\"><li> <b> Sai<\/b>.<br/>$\\overrightarrow{u}_1=(2;1;-2)$ là một vectơ chỉ phương của $\\Delta_1$. \t\t\t<\/li><li> <b> Sai<\/b>.<br/>$\\overrightarrow{u}_2=(-1;-2;2)$ là một vectơ chỉ phương của $\\Delta_2$. \t\t\t<\/li><li> <b> Đúng<\/b>.<br/>Côsin của góc giữa hai vectơ $\\overrightarrow{u}_1=(2;1;-2),\\overrightarrow{u}_2=(-1;-2;2)$ là \t\t\t$$\\cos\\left(\\overrightarrow{u}_1,\\overrightarrow{u}_2\\right)=\\dfrac{\\overrightarrow{u}_1\\cdot \\overrightarrow{u}_2}{\\left|\\overrightarrow{u}_1\\right|\\cdot \\left|\\overrightarrow{u}_2\\right|}=\\dfrac{-8}{3\\cdot 3}=-\\dfrac{8}{9}.$$ \t\t\t<\/li><li> <b> Sai<\/b>.<br/>Ta có $\\cos\\left(\\overrightarrow{u}_1,\\overrightarrow{u}_2\\right)=-\\dfrac{8}{9}$, suy ra $\\left(\\overrightarrow{u}_1,\\overrightarrow{u}_2\\right)\\approx {153}^{\\circ}$. <br/>Vậy $\\left(\\Delta_1,\\Delta_2\\right)\\approx {180}^{\\circ}-{153}^{\\circ}= {27}^{\\circ}$. \t\t<\/li><\/ol>", "choices": [{"html": "Vectơ có tọa độ $(1;2;3)$ là một vectơ chỉ phương của $\\Delta_1$", "correct": false}, {"html": "Vectơ có tọa độ $(4;5;6)$ là một vectơ chỉ phương của $\\Delta_2$", "correct": false}, {"html": "Côsin của góc giữa hai vectơ $\\overrightarrow{u}_1=(2;1;-2)$ và $\\overrightarrow{u}_2=(-1;-2;2)$ bằng $-\\dfrac{8}{9}$", "correct": true}, {"html": "Góc giữa hai đường thẳng $\\Delta_1$ và $\\Delta_2$ (làm tròn kết quả đến hàng đơn vị của độ) bằng ${48}^{\\circ}$", "correct": false}], "level": "H"}, {"id": "2D1H5-1"  thiên của mẫu số liệu ghép nhóm đã cho là $20$.", "correct": true}, {"html": "Số trung bình của mẫu số liệu ghép nhóm đã cho được tính bằng công thức<br/><div class=\"center\">$\\overline{x} = \\dfrac{8\\cdot 62+9\\cdot 66+1\\cdot 70+1\\cdot 74+1\\cdot 78}{20}$.<\/div>", "correct": true}, {"html": "Phương sai của mẫu số liệu ghép nhóm đã cho là $s^2 = \\sqrt{\\dfrac{436}{25}}$.", "correct": false}, {"html": "Độ lệch chuẩn của mẫu số liệu ghép nhóm đã cho (làm tròn đến hàng phần chục của kilôgam) là $4$ kg.", "correct": false}], "level": "H"}, {"id": "1H8V6-2", "type": "DS", "html": "<div class=\"immini\"><div class=\"im-l\">Hình ảnh máy tính xách tay đang mở ở hình vẽ bên gợi nên góc nhị diện và số đo góc $\\widehat{BAC}$ được gọi là độ mở của máy tính.<\/div><div class=\"im-r\"><div class=\"fig\"><img class=\"tikz\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAWAAAAEGCAIAAADUrthcAAAACXBIWXMAABP+AAAT/gEHlDmEAAAgAElEQVR42u2dd3xb5dmwH+vI2svykLzlvVeG7XhlECBkh0BJIGlTQsoIZbz0bRvSwg++khde6NemXxNGgRZKQqEkgQxIzAglO3bi2I6nLFmWbdkatrUla35/HEc4nvKQrWPf11+yrHF8dHT5uZ/nvu8nwO12IwAAgJEgwSkAAAAEAQAACAIAABAEAAAgCAAAQBAAAIAgAAAAQQAAAIIAAAAEAQAACAIAAAAEAQAACAIAABAEAAAgCAAAQBAAAIAgAAAAQQAAAIIAAAAEAQAACAIAAAAEAQAACAIAABAEAAAgCAAAQBAAAIAgAAAAQQAAAIIAAAAEAQAACAIAAAAEAQAACAIAABAEAAAgCAAAQBAAAIAgAAAAQQAAAIIAAAAEAQAACGLWOHHixP79++ETAgAQxFCsVuvLL78slUrhEwIAEMRQDh8+vGXLlq6uLviEAAAEcRutra1CoTAhIQEEAQAgiKGcOnVq9erVQqEQBAEAswvZ3w7o9OnTVqv11KlTCoViuCB6Ghv/c+ddBxMTXaQALpeLEAoODl6wYAH+Wx6XixCKjY2NjIwc/KzQ0FAmkwkfNgBMlAC32+0/R2Oz2d5///1Nmzbht2NiYnQ6HYfD8TzAYbWS6fTDwvD/m5jiudNsNDod9sGv06tR4TeEYQL8xs2aG4MfEB8fHysSIYQwciCLyUAILV60mBfEQwgFBgYyGQyEUFZWFpvNHvysqKgoMpkMFw0Agpgd3nzzze3bt7NYLPzH4ODgixcvpqSkDH7MmbS0uxsb341P+kdC0lTey2oxD/7R6XCYjYbB9zjsdr2uDyHEZrGYDCZCyGw2SVvEgx+zfMUK/AaVSqPRqAihO++8E7+HzWZjJBJCqKioaPBTmExmaGgoXHkACGIC9PT07Nu378yZMydOnIiLi3O73W+99daePXu2b9/+4osvhoSEeB5548CB1l//OopGr+bxp+iIqeN0Ouw2222DoH5rv8Uy+B6L2WwxGxFC/KAgSiAFIdQqbTEZjZ4HBPH5ubm5+G2ImwAQxJTAo4w7lq18tabKHxwxLdht/U6n0+ t\t<\/li><li> <b> Đúng<\/b>.<br/>Nếu $AB=AC=30$ cm và $BC=30\\sqrt{3}$ thì  \t\t\t$$\\cos \\widehat{BAC} = \\dfrac{30^2+30^2-(30\\sqrt{3})^2}{2\\cdot 30\\cdot 30}=-\\dfrac{1}{2}.$$ \t\t\tĐộ mở máy tính bằng số đo góc $\\widehat{BAC}=120^\\circ$. \t\t<\/li><\/ol>", "choices": [{"html": "$\\cos \\widehat{BAC} = -\\dfrac{AB^2+AC^2-BC^2}{2AB\\cdot AC}$", "correct": false}, {"html": "Nếu $AB=AC=30$ cm và $BC=30\\sqrt{3}$ cm thì $\\cos \\widehat{BAC}=-\\dfrac{1}{2}$", "correct": true}, {"html": "Nếu $\\cos \\widehat{BAC}=-\\dfrac{1}{2}$ thì $\\widehat{BAC}=60^\\circ$", "correct": false}, {"html": "Độ mở của máy tính là $120^\\circ$ nếu $AB=AC=30$ cm và $BC=30\\sqrt{3}$ cm", "correct": true}], "level": "V"}, {"id": "1D6H3-5", "type": "TLN", "html": "Ta coi năm lấy làm mốc để tính dân số của một vùng (hoặc một quốc gia) là năm $0$. Khi đó, dân số của quốc gia đó ở năm thứ $t$ là hàm số theo biến $t$ được cho bởi công thức $S=A \\mathrm{e}^{rt}$, trong đó $A$ là dân số của vùng (hoặc quốc gia) đó ở năm $0$ và $r$ là tỉ lệ tăng dân số hàng năm. Biết rằng dân số Việt Nam năm $2021$ ước tính là $98\\,564\\,407$ người và tỉ lệ tăng dân số hàng năm của Việt Nam là $r=0{,}93\\%$. Giả sử tỉ lệ tăng dân số hàng năm là như nhau tính từ năm $2021$. Hỏi từ năm nào trở đi, dân số nước ta vượt $120$ triệu người?", "sol": "Coi năm $2021$ làm mốc, ta có $A=98\\,564\\,407$ và $r=0{,}93\\%$. <br/>Khi đó, dân số Việt Nam tại năm thứ $t$ là $S=A\\cdot\\mathrm{e}^{rt}=98\\,564\\,407\\cdot \\mathrm{e}^{0{,}93\\%\\cdot t}$.<br/>Để dân số Việt Nam vượt $120$ triệu người thì $$98\\,564\\,407\\cdot \\mathrm{e}^{0{,}93\\%\\cdot t}&gt;120\\,000\\,000 \\Leftrightarrow t&gt;\\dfrac{\\ln \\frac{120\\,000\\,000}{98\\,564\\,407}}{0{,}93\\%}\\approx 21{,}16.$$ \t\tSuy ra giá trị nhỏ nhất của $t$ là $22$.<br/>Vậy, kể từ năm $2043$ trở đi, dân số nước ta sẽ vượt $120$ triệu người.", "answer": "2043", "level": "H"}, {"id": "2H2H2-6", "type": "TLN", "html": "Một nguồn âm phát ra sóng âm là sóng cầu. Khi gắn hệ trục tọa độ $Oxyz$ (đơn vị trên mỗi trục là mét). Cường độ âm chuẩn tại điểm $I(3 ; 4 ; 5)$ là tâm của nguồn phát âm với bán kính $10$ m. Để kiểm tra một điểm ở vị trí $M(7 ; 10 ; 17)$ có nhận được cường độ âm phát ra tại $I$ hay không người ta sẽ tính khoảng cách giữa hai vị trí $I$ và $M$. Hỏi khoảng cách giữa hai vị trí $I$ và $M$ là bao nhiêu mét?", "sol": "Ta có $I(3 ; 4 ; 5)$, $M(7;10;17)$ nên $IM=\\left|\\overrightarrow{IM}\\right|=\\sqrt{(7-3)^2+(10-4)^2+(17-5)^2}=14$.<br/>Vậy, khoảng cách giữa hai vị trí $I$ và $M$ là 14 mét.", "answer": "14", "level": "H"}, {"id": "2H5H1-7", "type": "TLN", "html": "Trong một khung lưới ô vuông gồm các hình lập phương, người ta đưa ra một cách kiểm tra bốn nút lưới (đỉnh hình lập phương) bất kì có đồng phẳng hay không bằng cách gắn hệ trục toạ độ $Oxyz$ vào khung lưới ô vuông và lập phương trình mặt phẳng đi qua ba nút lưới trong bốn nút lưới đã cho. Giả sử có ba nút lưới mà toạ độ lần lượt là $(1;1;10)$, $(4;3;1)$, $(3;2;5)$ và mặt phẳng đi qua ba nút lưới đó có phương trình $x+m y+n z+p=0$. Giá trị của $m+n+p$ là bao nhiêu?", "sol": "Xét các điểm $A(1;1;10)$, $B(4;3;1)$, $C(3;2;5)$.<br/>Khi đó, ta có $\\left\\{\\begin{aligned}&amp;\\overrightarrow{AB}=(3;2;-9) \\\\&amp;\\overrightarrow{AC}=(2;1;-5)\\end{aligned}\\right.\\Rightarrow \\left[\\overrightarrow{AB},\\overrightarrow{AC}\\right]=(-1;-3;-1)$.<br/>Gọi $\\overrightarrow{n}$ là một vectơ pháp tuyến của mặt phẳng đi qua ba điểm $A$, $B$, $C$.<br/>Ta có $$\\left\\{\\begin{aligned}&amp;\\overrightarrow{n}\\perp \\overrightarrow{AB}\\\\ &amp;\\overrightarrow{n}\\perp \\overrightarrow{AC}\\end{aligned}\\right.\\Rightarrow \\overrightarrow{n} \\text{cùng phương với } \\left[\\overrightarrow{AB},\\overrightarrow{AC}\\right].$$<br/>Chọn $\\overrightarrow{n}=(1;3;1)$. <br/>Suy ra phương trình của mặt phẳng đi qua ba nút lưới là \t\t$$1\\cdot (x-1)+3\\cdot (y-1)+1\\cdot (z-10)=0\\Leftrightarrow x+3y+z-14=0.$$ \t\tVậy $m=3$, $n=1$, $p=-14$ nên $m+n+p=-10$.", "answer": "-10", "level": "H"}, {"id": "2D1V3-6", "type": "TLN", "html": "Cho một tấm nhôm hình vuông cạnh $12$ cm, người ta cắt ở bốn góc bốn hình vuông bằng nhau, mỗi hình vuông có cạnh bằng $x$ (cm), rồi gập tấm nhôm lại để được một cái hộp có dạng hình hộp chữ nhật không có nắp (tham khảo hình vẽ). \t<div class=\"center\"> \t\t<div class=\"fig\"><img class=\"tikz\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAASsAAAC4CAIAAAA0Q126AAAACXBIWXMAABP+AAAT/gEHlDmEAAAJBElEQVR42u3dX0hTbwPA8efURNYsMNOWUppS4h9W4OpCKSJScoUoiaJFFnRlipDWhZmgRULQReVCyv4gpSJ2oTWLHFNKkYKRKchAskQkzaUWZUpn7ncx3r2jafn+avZOv5+r4/G4tuc8356dcptkt9sFgL9kBUMAUCBAgQAoEKBAABQIUCAACgQoEAAFAhQIgAIBCgTwmxRL/hH29vZWVFRwpheNzWaz2WweunG1Wl1ZWbmUhkvy3lcnff361c/Pb85vuT6o2trasbGx8PBwT9yHlJSUt2/fUp2rY8eOpaWleW7AXU/uAucAa6BHqFQqxyjLsrxx48bGxsaEhIQ5jwwPDw8ODvbQ3QgLC6M6V+vWrfPogP+7OcB1oAc1NDSMjIzk5uYy+5ct750DXl+gLMuFhYVCiJ6ens7OTubiMuTVc8DrC3T85SeE0Gg0LIPLdgF0bHjjHPDuAmVZvnPnzocPH4QQZrN5z549LIPLcAF89OhRT0+Pl84Br//fiMePHysUCiGEQqG4cuXK2NgYk3K5qamp8d454N0FOsbdVWBgIDNyWfH2OcDvxAAUCFAgAAoE/rx3794Zjcbp6ekvX760trZardY5D5Nl+dmzZzU1Na9evXL8qo3ZbG5paZmcnBwYGGhpaRkeHhZCWK1Wg8HQ3d1NgcCv3bt37/nz5yqVKiUlpaKiYmpq6sCBA+6HjY2N7d+/f3x8PDU1tbq6urS0VAgxOjqamZlZWVlpsViioqISExOrqqoMBkNkZGRxcfG1a9d+/+4pOENYwiYmJj5+/FhQUPDt2zeTyVRdXf358+fTp0+7H1lUVBQXF5eamiqESE1NnZ2dFULodLqIiAilUqnT6YQQO3fuNBqNjY2NQoiMjIz6+vr8/HwKBObl7+9fUFAghHj58uWWLVs2bdokhIiNjXU/0mAwXL9+3bGdmJjo3C9JUnR0tGNbqVSGhoY6t2dmZngWCiyIyWTavXu3Y/vTp0/uB/j5+U1NTc0dyYoVc25zHQj8QldX15kzZ4QQzc3NWq3WscdkMrkfmZOT8/DhQ+eXzvXQbrc7X2o43zbPQoF5rwMnJiYqKiry8vLa2tr8/f1HRkby8vLcjywpKSkuLs7NzY2Pjx8aGkpLSxNCXLp0aXBwUK/Xb9iwob+/v6Ojw9fXV6vVBgYG3rp1y2Kx6PX6kydP/s49lJbGJ3hK0rwPpLa2dvXq1R56wahWq+UjUH+Qnp6ek5Oz+AM+3xz48uWLUqlcuXLl9+/fp6enV69e/ZPbl2V5cnJy3bp1izZcrIFY4pxvY+Hj4+Pj4/OLHhSKxcyP60DgL6NAgAIBCgS8kSzLv9xDgYCnzMzMFBQUOKtraWlxvm2MV+DfQuHdVCpVQEBAXFycEKKgoKChoWFoaIg1EFg8hYWFjndqunr16uXLl93ft4ICAc8ug2VlZUIItVqdkZHhXXeeArFElkEhhNctgBSIpbMM3r9/3+sWQLFMfi/08OHDzNEl44cTLUnSQg5jDfyb3r59a/cM8Z9XqcApKyvLowPuXtoCj6R AOI2AgDiNgIA4jYA4jYCAOI2AgDiNgIA4jYCAOI2AOI2AgDiNgOBC/A/XqVFe1VxsPgAAAABJRU5ErkJggg==\" alt=\"Hình TikZ\"/><\/div> \t\t<\/div>", "sol": "Gọi parabol $y=f(x)$ có dạng $f(x)=ax^2+bx+c$. <br/>Parabol $y=f(x)$ nhận $Oy$ làm trục đối xứng nên ta có $\\dfrac{-b}{2 a}=0 \\Leftrightarrow b=0$. <br/>Lại có đồ thị hàm số $y=f(x)$ đi qua điểm $(0;-1)$ và điểm $(2;0)$ nên $\\left\\{\\begin{aligned}&amp;a=\\dfrac{1}{4}\\\\&amp; c=-1.\\end{aligned}\\right.$<br/>Suy ra $y=f(x)=\\dfrac{1}{4} x^2-1$.<br/>Tương tự, ta cũng có $y=g(x)=-\\dfrac{1}{4} x^2+2$.<br/>Phương trình hoành độ giao điểm của hai parabol là \t\t$$\\begin{aligned}\n\t\t\t\\dfrac{1}{4} x^2-1=-\\dfrac{1}{4} x^2+2 \\Leftrightarrow \\left[\\begin{aligned}&amp;x=\\sqrt{6} \\\\&amp;x=-\\sqrt{6}.\\end{aligned}\\right.\n\t\t\\end{aligned}$$ \t\tVậy, diện tích của logo là \t\t$$\\begin{aligned}\n\t\t\tS &amp; =\\displaystyle\\int\\limits_{-\\sqrt{6}}^{\\sqrt{6}}\\left[\\left(-\\dfrac{1}{4} x^2+2\\right)-\\left(\\dfrac{1}{4} x^2-1\\right)\\right] \\mathrm{d} x \\\\ \n\t\t\t&amp; =\\displaystyle\\int\\limits_{-\\sqrt{6}}^{\\sqrt{6}}\\left(3-\\dfrac{1}{2} x^2\\right) \\mathrm{d} x=\\left.\\left(3 x-\\dfrac{x^3}{6}\\right)\\right|_{-\\sqrt{6}} ^{\\sqrt{6}}=4 \\sqrt{6} \\approx 9{,}8\\left(\\mathrm{dm}^2\\right) .\n\t\t\\end{aligned}$$", "answer": "9{,}8", "level": "V"}, {"id": "2D6C2-2", "type": "TLN", "html": "Một công ty dược phẩm giới thiệu một dụng cụ để kiểm tra sớm bệnh sốt xuất huyết. Về báo cáo kiểm định chất lượng của sản phẩm, họ cho biết như sau: Số người được thử là $8\\,000$, trong số đó có $1\\,200$ người đã bị nhiễm bệnh sốt xuất huyết và có $6\\,800$ người không bị nhiễm bệnh sốt xuất huyết. Nhưng khi kiểm tra lại bằng dụng cụ của công ty, trong $1\\,200$ người đã bị nhiễm bệnh sốt xuất huyết, có $70 \\%$ số người đó cho kết quả dương tính, còn lại cho kết quả âm tính. Trong $6\\,800$ người không bị nhiễm bệnh sốt xuất huyết, có $5 \\%$ số người đó cho kết quả dương tính, còn lại cho kết quả âm tính. Xác suất mà một bệnh nhân với kết quả kiểm tra dương tính là bị nhiễm bệnh sốt xuất huyết bằng bao nhiêu (viết kết quả dưới dạng số thập phân và làm tròn đến hàng phần trăm)?", "sol": "<ul><li> Khi kiểm tra lại, trong $1\\,200$ người đã bị nhiễm bệnh sốt xuất huyết, có $70 \\%$ số người cho kết quả dương tính nên ta có $70 \\% \\cdot 1\\,200=840$ (người).<br/>Khi đó, số người bị nhiễm bệnh sốt xuất huyết cho kết quả âm tính trong số $1\\,200$ người đó là $1\\,200-840=360$ (người). \t\t\t<\/li><li> Khi kiểm tra lại, trong $6\\,800$ người không bị nhiễm bệnh sốt xuất huyết, có $5 \\%$ số người đó cho kết quả dương tính nên ta có là $5 \\% \\cdot 6\\,800=340$ (người).<br/>Khi đó, số người không bị nhiễm bệnh sốt xuất huyết cho kết quả âm tính trong $6\\,800$ người đó là $6\\,800-340=6\\,460$ (người).<br/>Từ đó, ta có bảng sau (đơn vị: người): \t\t\t<div class=\"center\"> \t\t\t\t<table class=\"tex-table\"><tr><td><\/td><td><table class=\"tex-table\"><tr><td>Số người<\/td><\/tr><tr><td>nhiễm bệnh<\/td><\/tr><\/table><\/td><td><table class=\"tex-table\"><tr><td>Số người không<\/td><\/tr><tr><td>nhiễm bệnh<\/td><\/tr><\/table><\/td><td>Tổng số<\/td><\/tr><tr><td><\/td><td>1 200<\/td><td>6 800<\/td><td>8 000<\/td><\/tr><tr><td>Dương tính<\/td><td>840<\/td><td>340<\/td><td>1 180<\/td><\/tr><tr><td>Âm tính<\/td><td>360<\/td><td>6 460<\/td><td>6 820<\/td><\/tr><\/table> \t\t\t<\/div> \t\t\t<\/li><li> Xét các biến cố sau: \t\t\t<ul><\/ul><\/li><li> $A$: “‘ Người được chọn ra trong số những người thử nghiệm là bị nhiễm bệnh sốt xuất huyết”’; \t\t\t\t<\/li><li> $B$: “‘ Người được chọn ra trong số những người thử nghiệm là không bị nhiễm bệnh sốt xuất huyết”’; \t\t\t\t<\/li><li> $C$: “‘ Người được chọn ra trong số những người thử nghiệm cho kết quả dương tính (khi kiểm tra lại)”’; \t\t\t\t<\/li><li> $D$: “‘ Người được chọn ra trong số những người thử nghiệm cho kết quả âm tính (khi kiểm tra lại)”’. \t\t\t \t\t\tSuy ra $\\mathrm{P}(C)=\\dfrac{1\\,180}{8\\,000}=\\dfrac{59}{400}$ và $\\mathrm{   m=s.match(/^(-?[\d.]+)\/(-?[\d.]+)$/);if(m)return parseFloat(m[1])/parseFloat(m[2]);return null}
function norm(s){return String(s||'').replace(/\$/g,'').replace(/\{,\}/g,'.').replace(/,/g,'.').replace(/\s+/g,'').replace(/^\+/,'')}
function sameAns(a,b){a=norm(a);b=norm(b);if(a===b)return true;let x=frac(a),y=frac(b);if(x===null)x=parseFloat(a);if(y===null)y=parseFloat(b);return !isNaN(x)&&!isNaN(y)&&Math.abs(x-y)<=(frac(b)!==null&&!Number.isInteger(y)?0.005:1e-6*Math.max(1,Math.abs(y)))}
function check(timeout){
  if(S.locked)return;const it=S.it;let frac=0;
  if(it.type==='TN'){
    if(S.sel==null&&!timeout){return}
    const ck=it.choices.findIndex(c=>c.correct);frac=(S.sel===ck)?1:0;
    [...$('body').children].forEach((e,k)=>{e.style.boxShadow='';if(k===ck)e.classList.add('ok');else if(k===S.sel)e.classList.add('bad');else e.classList.add('off')});
  }else if(it.type==='DS'){
    if(!timeout&&S.ds.some(v=>v===null)){$('fb').innerHTML='<div class="fb bad">Hãy chọn Đúng/Sai cho cả 4 ý.</div>';return}
    let n=0;[...$('body').children].forEach((e,k)=>{const r=S.ds[k]===it.choices[k].correct;if(r)n++;e.classList.add(r?'ok':'bad');
      e.querySelectorAll('button').forEach(x=>{x.classList.toggle('sel',(x.dataset.v==='1')===it.choices[k].correct)})});
    frac=[0,.1,.25,.5,1][n];
  }else{
    const v=$('inp').value;if(!v.trim()&&!timeout)return;frac=sameAns(v,it.answer)?1:0;
    $('inp').style.borderColor=frac?'var(--ok)':'var(--bad)';
    if(!frac)$('fb').innerHTML='<div class="fb bad">Đáp án đúng: $'+it.answer+'$</div>';
  }
  S.locked=true;clearInterval(S.timer);
  const full=frac===1;S.res[S.idx[S.i]]=full?'ok':(frac>0?'part':'bad');
  if(full){S.combo++;S.best=Math.max(S.best,S.combo);S.ok++;
    let pts=100+Math.min(S.combo-1,5)*20;if(S.mode==='challenge')pts+=Math.max(S.tl,0)*2;S.score+=pts;
    $('fb').innerHTML='<div class="fb ok pop">✅ Chính xác! +'+pts+' điểm'+(S.combo>1?' · 🔥 combo x'+S.combo:'')+'</div>';burst();
  }else{
    S.combo=0;S.bad++;S.wrongNow.push(S.idx[S.i]);
    if(it.type==='DS'&&frac>0){const p=Math.round(frac*100);S.score+=p;$('fb').innerHTML='<div class="fb bad">Đúng một phần (+'+p+' điểm)</div>'}
    else $('fb').innerHTML+=(timeout?'<div class="fb bad shake">⏰ Hết giờ!</div>':'<div class="fb bad shake">❌ Chưa đúng</div>');
    if(S.mode==='challenge')S.lives--;
  }
  $('hS').textContent=S.score;$('hC').textContent='🔥 '+S.combo;hearts();
  if(S.mode==='practice'||!full){if(it.sol)$('sol').innerHTML='<div class="sol"><b>Lời giải</b><br>'+it.sol+'</div>'}
  $('bCheck').classList.add('hidden');$('bSkip').classList.add('hidden');$('b5050').classList.add('hidden');$('bNext').classList.remove('hidden');
  $('bNext').textContent=(nextPos()<0||(S.mode==='challenge'&&S.lives<=0))?'Xem kết quả ➜':'Câu tiếp ➜';
  $('prog').style.width=(Object.keys(S.res).length/S.idx.length*100)+'%';typeset();
}
function todo(p){return !S.res[S.idx[p]]}
function nextPos(){for(let p=S.i+1;p<S.idx.length;p++)if(todo(p))return p;for(let p=0;p<S.i;p++)if(todo(p))return p;return -1}
function next(){
  const p=nextPos();
  if(p<0||(S.mode==='challenge'&&S.lives<=0))return finish();
  S.i=p;render();window.scrollTo(0,0);
}
// bảng trạng thái câu hỏi: đã làm / chưa làm / đã bỏ qua
function qsOpen(){qsRender();$('qs').classList.add('on')}
function qsClose(){$('qs').classList.remove('on')}
function qsRender(){
  const cur=S.idx[S.i],box=$('qsTiles');box.innerHTML='';let a=0,sk=0;
  const types=[...new Set(S.o.map(q=>D.items[q].type))].sort((x,y)=>{const a=TYPES.findIndex(t=>t[0]===x),b=TYPES.findIndex(t=>t[0]===y);return (a<0?9:a)-(b<0?9:b)});
  types.forEach(t=>{const qs=S.o.filter(q=>D.items[q].type===t);const done=qs.filter(q=>S.res[q]).length;
    const h=document.createElement('div');h.className='qsh';h.textContent=tname(t)+' — đã làm '+done+'/'+qs.length;box.appendChild(h);
    qs.forEach(q=>{const n=S.o.indexOf(q),r=S.res[q],st=r||(S.sk[q]?'skip':'todo');if(r)a++;else if(S.sk[q])sk++;
      const b=document.createElement('button');b.className='tile '+st+(q===cur?' cur':'');b.textContent=n+1;
      if(r){b.disabled=true}else b.onclick=()=>qsGo(q);box.appendChild(b)})});
  $('qsSum').innerHTML='Đã làm <b>'+a+'</b>/'+S.o.length+' · Chưa làm <b>'+(S.o.length-a)+'</b>'+(sk?' (trong đó bỏ qua '+sk+')':'')+' · Điểm ⭐ '+S.score}
function qsGo(q){const p=S.idx.indexOf(q);if(p<0)return;clearInterval(S.timer);S.i=p;qsClose();render();window.scrollTo(0,0)}
function qsFirst(){const q=S.o.find(q=>!S.res[q]);if(q===undefined){qsClose();return}qsGo(q)}
function qsFinish(){const left=S.o.filter(q=>!S.res[q]).length;
  if(left&&!confirm('Còn '+left+' câu chưa làm. Nộp bài ngay?'))return;S.early=left>0;qsClose();finish()}
function fifty(){if(S.locked||S.h5<=0||S.it.type!=='TN')return;S.h5--;$('n5050').textContent=S.h5;
  const ck=S.it.choices.findIndex(c=>c.correct);const w=shuffle([0,1,2,3].filter(k=>k!==ck&&k<S.it.choices.length)).slice(0,2);
  w.forEach(k=>{const e=$('body').children[k];e.classList.add('off');e.style.pointerEvents='none';if(S.sel===k)S.sel=null})}
function skipQ(){if(S.locked||S.skip<=0)return;S.skip--;S.sk[S.idx[S.i]]=1;S.idx.push(S.idx[S.i]);S.idx.splice(S.i,1);render()}
function finish(){
  clearInterval(S.timer);qsClose();show('end');const tot=S.early?S.idx.length:S.ok+S.bad,pct=tot?Math.round(S.ok/tot*100):0;
  const dead=S.mode==='challenge'&&S.lives<=0;
  $('eIcon').textContent=dead?'💀':pct>=80?'🏆':pct>=50?'👍':'💪';
  $('eTitle').textContent=dead?'Hết mạng rồi!':pct>=80?'Xuất sắc!':pct>=50?'Khá tốt!':'Cố gắng lên!';
  $('eStat').innerHTML=S.name+' đạt <b>'+S.score+' điểm</b><br>Đúng '+S.ok+'/'+tot+' ('+pct+'%) · combo dài nhất 🔥 '+S.best;
  const bd=[];if(pct===100&&tot>=3)bd.push('🌟 Hoàn hảo');if(S.best>=5)bd.push('🔥 Chuỗi '+S.best);if(S.mode==='challenge'&&!dead&&S.lives===D.lives)bd.push('🛡️ Không mất mạng');
  $('eBadges').textContent=bd.join('   ');
  let w=new Set(store.get('wrong',[]));S.wrongNow.forEach(i=>w.add(i));
  S.idx.forEach(i=>{if(S.res[i]==='ok'&&S.mode==='practice')w.delete(i)});
  store.set('wrong',[...w]);
  if(D.report&&S.mode==='challenge'){try{fetch(D.report,{method:'POST',body:JSON.stringify({room:D.room,name:S.name,sid:S.sid||'',score:S.score,pct:pct})})}catch(e){}}
  if(S.mode==='challenge'){const lb=store.get('lb',[]);lb.push({n:S.name,s:S.score,p:pct,d:new Date().toLocaleDateString('vi-VN')});lb.sort((a,b)=>b.s-a.s);store.set('lb',lb.slice(0,10))}
  const lb=store.get('lb',[]);$('lb').innerHTML=lb.length?'<table class="lb"><tr><th>#</th><th>Tên</th><th>Điểm</th><th>Đúng</th><th>Ngày</th></tr>'+lb.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+r.n.replace(/</g,'&lt;')+'</td><td>'+r.s+'</td><td>'+r.p+'%</td><td>'+r.d+'</td></tr>').join('')+'</table>':'<span class="mut">Chưa có kết quả (chỉ chế độ Thử thách được xếp hạng).</span>';
  if(pct>=80)for(let k=0;k<4;k++)setTimeout(burst,k*300);
}
// pháo giấy
const cv=$('fx'),cx=cv.getContext('2d');let P=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);
function burst(){for(let i=0;i<40;i++)P.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*12,vy:Math.random()*-10-2,c:`hsl(${Math.random()*360},90%,60%)`,l:70})}
(function loop(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l>0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.l--;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,7,5)});requestAnimationFrame(loop)})();
</script></body></html>
